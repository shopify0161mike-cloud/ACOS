      - Supplier qualification must be reproducible from retained evidence.
    implementation_refs: []

  - id: DOM-COM-FIN-001
    name: Commerce Finance Domain
    domain_group: commerce
    bounded_context: commerce_finance
    purpose: Own deterministic unit economics, commercial margin and product-level financial models.
    business_owner: Chief Financial Officer
    technical_owner: Finance Platform Lead
    classification: core
    status: approved
    owned_capabilities:
