registry_version: 1.0.0
architecture_chapter: '1.2'
status: canonical

domains:
  - id: DOM-COM-PRO-001
    name: Product Domain
    domain_group: commerce
    bounded_context: product
    purpose: Govern product discovery, qualification, acceptance readiness and product lifecycle state.
    business_owner: Chief Commerce Officer
    technical_owner: Product Platform Lead
    classification: core
    status: approved
    owned_capabilities:
      - CAP-COM-PRO-001
      - CAP-COM-PRO-002
    owned_data:
      - product_candidates
      - product_qualification_records
      - product_lifecycle
    commands_accepted:
      - discover_product_candidate
      - qualify_product_candidate
      - submit_product_for_acceptance
    events_published:
      - product.candidate_discovered.v1
      - product.validation_completed.v1
      - approval.product_acceptance_requested.v1
    events_consumed:
      - market.opportunity_identified.v1
      - supplier.qualification_completed.v1
      - approval.product_accepted.v1
      - approval.product_rejected.v1
    upstream_domains:
      - DOM-INT-MKT-001
      - DOM-COM-SUP-001
      - DOM-GOV-APR-001
    downstream_domains:
      - DOM-COM-BRA-001
      - DOM-COM-MKT-001
    integration_patterns:
      - customer_supplier
      - published_language
    external_dependencies: []
    governance_policies:
      - POL-GOV-AUT-001
      - POL-GOV-RSK-001
      - POL-GOV-APR-001
    invariants:
      - Product qualification must retain evidence, provenance, assumptions and confidence.
      - A product cannot become accepted without authenticated human approval.
    implementation_refs: []

