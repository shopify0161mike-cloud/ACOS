name: Enterprise Architecture Validation

on:
  push:
    paths:
      - 'config/capabilities/**'
      - 'schemas/**'
      - 'docs/architecture/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/architecture-validation.yml'
  pull_request:
    paths:
      - 'config/capabilities/**'
      - 'schemas/**'
      - 'docs/architecture/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/architecture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-architecture:
    name: Capability architecture controls
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema[format]>=4.23,<5' 'PyYAML>=6.0,<7'

      - name: Validate capability registry against schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import jsonschema
          import yaml

          registry_path = Path('config/capabilities/registry.yaml')
          schema_path = Path('schemas/capability-registry.schema.json')

          for path in (registry_path, schema_path):
              if not path.is_file():
                  raise SystemExit(f'Required architecture artifact is missing: {path}')

          with registry_path.open(encoding='utf-8') as handle:
              registry = yaml.safe_load(handle)

          with schema_path.open(encoding='utf-8') as handle:
              schema = json.load(handle)

          validator_class = jsonschema.validators.validator_for(schema)
          validator_class.check_schema(schema)
          validator = validator_class(schema, format_checker=jsonschema.FormatChecker())
          errors = sorted(validator.iter_errors(registry), key=lambda error: list(error.absolute_path))

          if errors:
              print('Capability registry schema validation failed:')
              for error in errors:
                  location = '.'.join(str(part) for part in error.absolute_path) or '<root>'
                  print(f'  - {location}: {error.message}')
              raise SystemExit(1)

          print(f"Validated {len(registry.get('capabilities', []))} capabilities against {schema_path}.")
          PY

      - name: Validate capability identifiers and dependencies
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          import yaml

          registry_path = Path('config/capabilities/registry.yaml')
          with registry_path.open(encoding='utf-8') as handle:
              registry = yaml.safe_load(handle)

          capabilities = registry.get('capabilities', [])
          ids = [capability.get('id') for capability in capabilities]
          id_pattern = re.compile(r'^CAP-(COM|INT|GOV|PLT)-[A-Z]{3}-\d{3}$')

          failures = []
          duplicates = sorted(identifier for identifier, count in Counter(ids).items() if count > 1)
          if duplicates:
              failures.append(f'Duplicate capability IDs: {duplicates}')

          invalid_ids = sorted(identifier for identifier in ids if not isinstance(identifier, str) or not id_pattern.fullmatch(identifier))
          if invalid_ids:
              failures.append(f'Invalid capability IDs: {invalid_ids}')

          known = set(ids)
          for capability in capabilities:
              capability_id = capability.get('id', '<missing-id>')
              dependencies = capability.get('dependencies', [])

              if capability_id in dependencies:
                  failures.append(f'{capability_id} depends on itself')

              duplicate_dependencies = sorted(
                  dependency for dependency, count in Counter(dependencies).items() if count > 1
              )
              if duplicate_dependencies:
                  failures.append(
                      f'{capability_id} contains duplicate dependencies: {duplicate_dependencies}'
                  )

              unresolved = sorted(set(dependencies) - known)
              if unresolved:
                  failures.append(
                      f'{capability_id} contains unresolved dependencies: {unresolved}'
                  )

          if failures:
              print('Capability identity or dependency validation failed:')
              for failure in failures:
                  print(f'  - {failure}')
              raise SystemExit(1)

          print(f'Validated identifiers and dependency references for {len(capabilities)} capabilities.')
          PY

      - name: Reject circular capability dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          registry_path = Path('config/capabilities/registry.yaml')
          with registry_path.open(encoding='utf-8') as handle:
              registry = yaml.safe_load(handle)

          graph = {
              capability['id']: list(capability.get('dependencies', []))
              for capability in registry.get('capabilities', [])
          }

          WHITE, GRAY, BLACK = 0, 1, 2
          state = {node: WHITE for node in graph}
          stack = []
          stack_index = {}
          cycles = []

          def visit(node):
              state[node] = GRAY
              stack_index[node] = len(stack)
              stack.append(node)

              for dependency in graph[node]:
                  if state[dependency] == WHITE:
                      visit(dependency)
                  elif state[dependency] == GRAY:
                      start = stack_index[dependency]
                      cycles.append(stack[start:] + [dependency])

              stack.pop()
              stack_index.pop(node, None)
              state[node] = BLACK

          for node in graph:
              if state[node] == WHITE:
                  visit(node)

          if cycles:
              print('Circular capability dependencies detected:')
              for cycle in cycles:
                  print('  - ' + ' -> '.join(cycle))
              raise SystemExit(1)

          print(f'Capability dependency graph is acyclic across {len(graph)} nodes.')
          PY

      - name: Validate canonical capability diagrams exist
        run: |
          python - <<'PY'
          from pathlib import Path

          required_diagrams = [
              Path('docs/architecture/diagrams/enterprise-capability-map.mmd'),
              Path('docs/architecture/diagrams/capability-dependency-graph.mmd'),
              Path('docs/architecture/diagrams/capability-lifecycle.mmd'),
              Path('docs/architecture/diagrams/capability-governance-flow.mmd'),
          ]

          failures = []
          for diagram in required_diagrams:
              if not diagram.is_file():
                  failures.append(f'Missing canonical diagram: {diagram}')
                  continue

              content = diagram.read_text(encoding='utf-8').strip()
              if not content:
                  failures.append(f'Canonical diagram is empty: {diagram}')
              elif not any(token in content for token in ('flowchart', 'graph ', 'stateDiagram')):
                  failures.append(f'No Mermaid diagram declaration found in: {diagram}')

          if failures:
              print('Canonical capability diagram validation failed:')
              for failure in failures:
                  print(f'  - {failure}')
              raise SystemExit(1)

          print(f'Validated {len(required_diagrams)} canonical capability diagrams.')
          PY

  repository-compliance:
    name: Existing repository compliance suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: python -m pip install 'PyYAML>=6.0,<7'

      - name: Validate constitution
        run: python scripts/validate_constitution.py

      - name: Run compliance tests
        run: python -m unittest discover -s tests -p 'test_*.py'
