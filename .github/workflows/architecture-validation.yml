name: Enterprise Architecture Validation

on:
  push:
    paths:
      - 'config/capabilities/**'
      - 'schemas/**'
      - 'docs/architecture/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/architecture-validation.yml'
  pull_request:
    paths:
      - 'config/capabilities/**'
      - 'schemas/**'
      - 'docs/architecture/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/architecture-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-architecture:
    name: Capability architecture controls
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema[format]>=4.23,<5' 'PyYAML>=6.0,<7'

      - name: Validate capability registry
        run: python scripts/validate_capability_registry.py

      - name: Validate capability dependency graph
        run: python scripts/validate_capability_dependencies.py

      - name: Validate canonical capability diagrams
        run: python scripts/validate_capability_diagrams.py

  repository-compliance:
    name: Existing repository compliance suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: python -m pip install 'PyYAML>=6.0,<7'

      - name: Validate constitution
        run: python scripts/validate_constitution.py

      - name: Run compliance tests
        run: python -m unittest discover -s tests -p 'test_*.py'
